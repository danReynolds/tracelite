name: tracelite
description: >-
  Cross-library SQLite profiling and tracing for the Dart ecosystem.
  See into SQLite, FFI, and any peer library on a unified timeline.
version: 0.0.1-dev

homepage: https://github.com/danReynolds/tracelite
repository: https://github.com/danReynolds/tracelite

environment:
  sdk: ^3.6.0

dependencies:
  ffi: ^2.1.4
  yaml: ^3.1.2

dev_dependencies:
  crypto: ^3.0.7
  drift: ^2.33.0
  lints: ^4.0.0
  resqlite: ^0.3.1
  sqlite3: ^3.3.1
  sqlite_async: ^0.14.1
  test: ^1.25.0

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite_traced
    resqlite:
      trace_sqlite: true
      tracelite_root: .
