name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    runs-on: macos-14

    steps:
      - name: Check out tracelite
        uses: actions/checkout@v4
        with:
          path: tracelite

      - name: Check out resqlite sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/resqlite
          path: resqlite
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: tracelite
        run: dart pub get

      - name: Verify generated span outputs
        working-directory: tracelite
        run: dart run tool/generate.dart --check

      - name: Build native runtime and SQLite shim
        working-directory: tracelite
        run: |
          mkdir -p build
          cc -dynamiclib -O2 -Inative \
            native/tracelite_runtime.c \
            -o build/libtracelite_runtime.dylib
          cc -dynamiclib -O2 -Inative \
            native/tracelite_runtime.c native/shim_sqlite3.c \
            -Wl,-reexport-lsqlite3 \
            -o build/libsqlite_traced.dylib
          cc -std=c11 -O2 -Inative \
            native/tracelite_runtime.c native/test_producer.c \
            -o build/test_producer

      - name: Analyze
        working-directory: tracelite
        run: dart analyze

      - name: Test
        working-directory: tracelite
        run: dart test

      - name: CI benchmark suite
        working-directory: tracelite
        run: |
          dart run bin/tracelite.dart suite \
            --profile=ci \
            --interfaces=sqlite3,drift,sqlite_async,resqlite \
            --out-dir=build/tracelite-ci-suite

  linux-shim:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tracelite
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Verify generated span outputs
        run: dart run tool/generate.dart --check

      - name: Build native runtime and SQLite shim
        run: |
          mkdir -p build
          cc -shared -fPIC -O2 -Inative \
            native/tracelite_runtime.c \
            -o build/libtracelite_runtime.so
          cc -shared -fPIC -O2 -Inative \
            native/tracelite_runtime.c native/shim_sqlite3.c \
            -Wl,--no-as-needed -lsqlite3 \
            -o build/libsqlite_traced.so
          cc -std=c11 -O2 -Inative \
            native/tracelite_runtime.c native/test_producer.c \
            -o build/test_producer

      - name: Analyze
        run: dart analyze

      - name: Platform smoke tests
        run: |
          dart test \
            test/runtime_smoke_test.dart \
            test/shim_smoke_test.dart \
            test/native_artifacts_test.dart \
            test/package_boundary_test.dart
