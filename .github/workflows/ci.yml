name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RESQLITE_TRACE_REVISION: '4e9f0fbd658fc320a9847547af318cb9428e1f15'
  SQLITE_AMALGAMATION_VERSION: '3530100'

jobs:
  macos:
    runs-on: macos-14

    steps:
      - name: Check out tracelite
        uses: actions/checkout@v6.0.2
        with:
          path: tracelite

      - name: Check out resqlite sibling
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository_owner }}/resqlite
          ref: ${{ env.RESQLITE_TRACE_REVISION }}
          path: resqlite
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Pin resqlite sibling dependency
        working-directory: tracelite
        run: |
          cat > pubspec_overrides.yaml <<YAML
          dependency_overrides:
            resqlite:
              path: $GITHUB_WORKSPACE/resqlite
          YAML

      - name: Install dependencies
        working-directory: tracelite
        run: dart pub get

      - name: Verify resqlite source override
        working-directory: tracelite
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/verify_resqlite_source.dart
          --revision=$RESQLITE_TRACE_REVISION

      - name: Verify generated span outputs
        working-directory: tracelite
        run: dart run tool/generate.dart --check

      - name: Build native runtime and SQLite shim
        working-directory: tracelite
        run: |
          mkdir -p build
          cc -dynamiclib -O2 -Inative \
            native/tracelite_runtime.c \
            -o build/libtracelite_runtime.dylib
          cc -dynamiclib -O2 -Inative \
            native/tracelite_runtime.c native/shim_sqlite3.c \
            -Wl,-reexport-lsqlite3 \
            -o build/libsqlite_traced.dylib
          cc -std=c11 -O2 -Inative \
            native/tracelite_runtime.c native/test_producer.c \
            -o build/test_producer

      - name: Analyze
        working-directory: tracelite
        run: dart analyze

      - name: Test
        working-directory: tracelite
        run: dart test

      - name: Publish archive smoke
        working-directory: tracelite
        run: dart run tool/publish_check.dart

      - name: CI benchmark suite
        working-directory: tracelite
        run: |
          dart run bin/tracelite.dart suite \
            --profile=ci \
            --interfaces=sqlite3,drift,sqlite_async,resqlite \
            --out-dir=build/tracelite-ci-suite

  linux-shim:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tracelite
        uses: actions/checkout@v6.0.2
        with:
          path: tracelite

      - name: Check out resqlite sibling
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository_owner }}/resqlite
          ref: ${{ env.RESQLITE_TRACE_REVISION }}
          path: resqlite
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Pin resqlite sibling dependency
        working-directory: tracelite
        run: |
          cat > pubspec_overrides.yaml <<YAML
          dependency_overrides:
            resqlite:
              path: $GITHUB_WORKSPACE/resqlite
          YAML

      - name: Install dependencies
        working-directory: tracelite
        run: dart pub get

      - name: Verify resqlite source override
        working-directory: tracelite
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/verify_resqlite_source.dart
          --revision=$RESQLITE_TRACE_REVISION

      - name: Verify generated span outputs
        working-directory: tracelite
        run: dart run tool/generate.dart --check

      - name: Build native runtime and SQLite shim
        working-directory: tracelite
        run: |
          mkdir -p build
          cc -shared -fPIC -O2 -Inative \
            native/tracelite_runtime.c \
            -o build/libtracelite_runtime.so
          cc -shared -fPIC -O2 -Inative \
            native/tracelite_runtime.c native/shim_sqlite3.c \
            -Wl,--no-as-needed -lsqlite3 \
            -o build/libsqlite_traced.so
          cc -std=c11 -O2 -Inative \
            native/tracelite_runtime.c native/test_producer.c \
            -o build/test_producer

      - name: Analyze
        working-directory: tracelite
        run: dart analyze

      - name: Platform smoke tests
        working-directory: tracelite
        run: |
          dart test \
            test/runtime_smoke_test.dart \
            test/shim_smoke_test.dart \
            test/native_artifacts_test.dart \
            test/package_boundary_test.dart

      - name: Linux CI benchmark suite
        working-directory: tracelite
        run: |
          dart run bin/tracelite.dart suite \
            --profile=ci \
            --interfaces=sqlite3,drift,sqlite_async,resqlite \
            --out-dir=build/tracelite-linux-ci-suite

  windows-core:
    runs-on: windows-2025

    steps:
      - name: Check out tracelite
        uses: actions/checkout@v6.0.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Verify generated span outputs
        run: dart --packages=.dart_tool/package_config.json tool/generate.dart --check

      - name: Analyze Dart artifact surface
        run: >-
          dart analyze
          lib
          bin
          tool/build_sqlite_shim.dart
          tool/sqlite_shim_smoke.dart
          tool/platform_core_smoke.dart
          test/native_artifacts_test.dart
          test/package_boundary_test.dart
          test/insights_test.dart
          test/diff_statistics_test.dart

      - name: Core artifact smoke
        run: dart --packages=.dart_tool/package_config.json tool/platform_core_smoke.dart

      - name: Windows native runtime smoke
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/native_runtime_smoke.dart

      - name: Download SQLite amalgamation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $version = "${{ env.SQLITE_AMALGAMATION_VERSION }}"
          $url = "https://sqlite.org/2026/sqlite-amalgamation-$version.zip"
          $zip = "build/sqlite-amalgamation.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath build/sqlite-amalgamation -Force

      - name: Build Windows embedded SQLite shim
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/build_sqlite_shim.dart
          --sqlite-amalgamation=build/sqlite-amalgamation/sqlite-amalgamation-${{ env.SQLITE_AMALGAMATION_VERSION }}/sqlite3.c

      - name: Windows SQLite shim smoke
        env:
          TRACELITE_SQLITE_AMALGAMATION: build/sqlite-amalgamation/sqlite-amalgamation-${{ env.SQLITE_AMALGAMATION_VERSION }}/sqlite3.c
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/sqlite_shim_smoke.dart
