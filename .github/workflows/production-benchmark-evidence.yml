name: Production Benchmark Evidence

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Whole production suite-history runs to record.
        required: true
        default: 5
        type: number
      scenarios:
        description: Comma-separated production scenarios to execute.
        required: true
        default: high-cardinality-fanout,many-streams-writer-throughput,point-select,keyed-pk-subscriptions
        type: string
      policy_scenarios:
        description: Comma-separated scenarios used for strict calibration.
        required: true
        default: high-cardinality-fanout,many-streams-writer-throughput,point-select,keyed-pk-subscriptions
        type: string
      min_repetitions:
        description: Minimum repetitions forwarded into each suite run.
        required: true
        default: 5
        type: number
      suite_timeout_seconds:
        description: Timeout for each whole suite run.
        required: true
        default: 1200
        type: number
      runner:
        description: Peer child runner mode for repeated production suites.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - script
          - worker
      resqlite_revision:
        description: Trace-enabled resqlite revision to use as the sibling checkout.
        required: true
        default: aabcce733240b8586216f8c32bcc1a16f806586f
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RESQLITE_TRACE_REVISION: aabcce733240b8586216f8c32bcc1a16f806586f
  SQLITE_AMALGAMATION_VERSION: '3530100'

jobs:
  production-history:
    name: Production history (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-14
          - label: linux-x64
            os: ubuntu-24.04
          - label: windows-x64
            os: windows-2025

    steps:
      - name: Check out tracelite
        uses: actions/checkout@v6.0.2
        with:
          path: tracelite

      - name: Check out resqlite sibling
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository_owner }}/resqlite
          ref: ${{ inputs.resqlite_revision }}
          path: resqlite
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Pin resqlite sibling dependency
        working-directory: tracelite
        shell: bash
        run: |
          cat > pubspec_overrides.yaml <<YAML
          dependency_overrides:
            resqlite:
              path: $GITHUB_WORKSPACE/resqlite
          YAML

      - name: Install dependencies
        working-directory: tracelite
        run: dart pub get

      - name: Verify resqlite source override
        working-directory: tracelite
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/verify_resqlite_source.dart
          --revision=${{ inputs.resqlite_revision }}

      - name: Verify generated span outputs
        working-directory: tracelite
        run: dart run tool/generate.dart --check

      - name: Build and smoke native runtime
        working-directory: tracelite
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/native_runtime_smoke.dart

      - name: Download Windows SQLite amalgamation
        if: runner.os == 'Windows'
        working-directory: tracelite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $version = "${{ env.SQLITE_AMALGAMATION_VERSION }}"
          $url = "https://sqlite.org/2026/sqlite-amalgamation-$version.zip"
          $zip = "build/sqlite-amalgamation.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath build/sqlite-amalgamation -Force

      - name: Build SQLite shim
        if: runner.os != 'Windows'
        working-directory: tracelite
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/build_sqlite_shim.dart

      - name: Build Windows embedded SQLite shim
        if: runner.os == 'Windows'
        working-directory: tracelite
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/build_sqlite_shim.dart
          --sqlite-amalgamation=build/sqlite-amalgamation/sqlite-amalgamation-${{ env.SQLITE_AMALGAMATION_VERSION }}/sqlite3.c

      - name: Smoke SQLite shim
        working-directory: tracelite
        env:
          TRACELITE_SQLITE_AMALGAMATION: build/sqlite-amalgamation/sqlite-amalgamation-${{ env.SQLITE_AMALGAMATION_VERSION }}/sqlite3.c
        run: >-
          dart --packages=.dart_tool/package_config.json
          tool/sqlite_shim_smoke.dart

      - name: Run production suite history
        working-directory: tracelite
        shell: bash
        env:
          TRACELITE_SQLITE_AMALGAMATION: build/sqlite-amalgamation/sqlite-amalgamation-${{ env.SQLITE_AMALGAMATION_VERSION }}/sqlite3.c
        run: |
          set -euo pipefail
          out_dir="build/production-evidence/${{ matrix.label }}"
          mkdir -p "$out_dir"
          dart run bin/tracelite.dart suite-history \
            --profile=production \
            --interfaces=sqlite3,drift,sqlite_async,resqlite \
            --scenarios="${{ inputs.scenarios }}" \
            --policy-scenarios="${{ inputs.policy_scenarios }}" \
            --policy-peers=resqlite \
            --metrics=measured_elapsed_ns \
            --runs=${{ inputs.runs }} \
            --min-repetitions=${{ inputs.min_repetitions }} \
            --runner=${{ inputs.runner }} \
            --suite-run-timeout-seconds=${{ inputs.suite_timeout_seconds }} \
            --threshold-ceiling-percent=50 \
            --guardrail-ceiling-percent=50 \
            --noise-gate-ceiling-percent=50 \
            --require-clean-source=true \
            --strict=false \
            --out-dir="$out_dir"

      - name: Export production graph data
        working-directory: tracelite
        shell: bash
        run: |
          set -euo pipefail
          out_dir="build/production-evidence/${{ matrix.label }}"
          if [[ -f "$out_dir/history.json" ]]; then
            if dart run bin/tracelite.dart export-graph-data \
              --suite-history="$out_dir/history.json" \
              --out="$out_dir/graph-data"; then
              dart run bin/tracelite.dart validate-graph-data "$out_dir/graph-data"
              echo "graph-data: ok" > "$out_dir/graph-data-status.txt"
            else
              echo "graph-data: failed" > "$out_dir/graph-data-status.txt"
            fi
          else
            echo "graph-data: missing history.json" > "$out_dir/graph-data-status.txt"
          fi

      - name: Explain production evidence
        working-directory: tracelite
        shell: bash
        run: |
          set -euo pipefail
          out_dir="build/production-evidence/${{ matrix.label }}"
          if [[ -f "$out_dir/history.json" ]]; then
            dart run bin/tracelite.dart explain "$out_dir/history.json" \
              > "$out_dir/insights.md" || \
              echo "tracelite explain failed" > "$out_dir/insights.md"
          else
            echo "missing history.json" > "$out_dir/insights.md"
          fi

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tracelite-production-history-${{ matrix.label }}
          path: tracelite/build/production-evidence/${{ matrix.label }}/
          if-no-files-found: error

      - name: Evaluate production evidence
        working-directory: tracelite
        shell: bash
        run: |
          set -euo pipefail
          python_cmd=python3
          if ! command -v "$python_cmd" >/dev/null 2>&1; then
            python_cmd=python
          fi
          "$python_cmd" - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("build/production-evidence/${{ matrix.label }}")
          history_path = root / "history.json"
          if not history_path.exists():
              print(f"missing {history_path}")
              sys.exit(65)

          history = json.loads(history_path.read_text())
          problems = []
          requested = history.get("requested_runs")
          successful = history.get("successful_runs")
          if requested != successful:
              problems.append(
                  f"successful_runs={successful} requested_runs={requested}"
              )
          status = history.get("calibration_status")
          if status != "ready":
              problems.append(f"calibration_status={status}")

          if problems:
              print("production evidence is not ready:")
              for problem in problems:
                  print(f"- {problem}")
              print(f"uploaded evidence root: {root}")
              sys.exit(65)

          print("production evidence is ready")
          PY
